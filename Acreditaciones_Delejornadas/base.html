<html>

<head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body style="font-family: Montserrat;">
    <div style="width: 1411px; height: 950px; left: 0px; top: 0px; position: absolute; background: white"></div>
    <img style="width: 380px; height: 950px; left: 0px; top: 0px; position: absolute" src="base/centro.png">
    <img style="width: 215px; height: 160px; left: 82px; top: 34px; position: absolute; border-radius: 4px"
        src="base/dele.png">
    <div
        style="width: 350px; height: 84px; left: 15px; top: 194px; position: absolute; color: #000e78; font-size: 60px; font-family: Montserrat; font-weight: 700; word-wrap: break-word; text-align: center">
        {event}
    </div>
    <img style="width: 297px; height: 91px; left: 41px; top: 750px; position: absolute" src="base/uc3m.png">
    <div
        style="width:1031px; text-align: center; left: 380px; top: 174px; position: absolute; font-size: 100px; font-family: Montserrat; font-weight: 700;  color: {color}">
        {name}
    </div>
    <div
        style="width: 1031px; text-align: center; left: 380px; top: 295px; position: absolute; color: black; font-size: 60px; font-family: Montserrat; font-weight: 400">
        {surname}
    </div>
    <div
        style="width: 1031px; text-align: center; left: 380px; top: 470px; position: absolute; text-align: center; color: black; font-size: 45px; font-family: Montserrat; font-weight: 600; word-wrap: break-word">
        {degree}
    </div>
    {team}
    {rol}
</body>

</html>
